<script>
  window.__bootTimeout = setTimeout(function(){
    var el = document.getElementById('boot-fallback');
    if (el) {
      el.innerHTML = '<p style="font-size:32px;margin-bottom:8px;">⚠️</p>' +
        '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Couldn\'t load the app</p>' +
        '<p style="font-size:13px;opacity:0.6;max-width:280px;line-height:1.5;">A script failed to load. Check your connection and reload.</p>' +
        '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>';
    }
  }, 12000);

  function showFailure(msg) {
    clearTimeout(window.__bootTimeout);
    var el = document.getElementById('boot-fallback');
    if (el) {
      el.innerHTML = '<p style="font-size:32px;margin-bottom:8px;">⚠️</p>' +
        '<p style="font-size:15px;font-weight:600;margin-bottom:8px;">Couldn\'t load required files</p>' +
        '<p style="font-size:13px;opacity:0.6;max-width:280px;line-height:1.5;">' + msg + '</p>' +
        '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>';
    }
  }

  function loadScriptWithFallback(primaryUrl, fallbackUrl, onDone, onFail) {
    var s = document.createElement('script');
    s.src = primaryUrl;
    s.onload = onDone;
    s.onerror = function() {
      var f = document.createElement('script');
      f.src = fallbackUrl;
      f.onload = onDone;
      f.onerror = onFail;
      document.body.appendChild(f);
    };
    document.body.appendChild(s);
  }

  var scriptsToLoad = [
    ["https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js", "https://unpkg.com/react@18/umd/react.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js", "https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js", "https://unpkg.com/@babel/standalone@7/babel.min.js"]
  ];

  function loadNext(i) {
    if (i >= scriptsToLoad.length) {
      try {
        var src = document.getElementById('app-source').textContent;
        // runtime:'classic' emits React.createElement. Without it, newer Babel
        // defaults to the automatic runtime and emits ESM imports, which blow up
        // inside new Function().
        var transformed = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
        var runner = new Function(transformed);
        runner();
      } catch(e) {
        showFailure('The app failed to start: ' + (e.message||'unknown error') + '. Try reloading.');
      }
      return;
    }
    loadScriptWithFallback(
      scriptsToLoad[i][0],
      scriptsToLoad[i][1],
      function(){ loadNext(i+1); },
      function(){ showFailure('Both backup networks failed. Check your connection and reload.'); }
    );
  }
  loadNext(0);
</script>
<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Photo storage tuning ──────────────────────────────────────────────────
   Stored photos are downscaled before they hit localStorage. 480px is the
   sweet spot: sharp in the detail view (which renders ~390 CSS px wide) at
   ~35-50KB per photo. Raising PHOTO_MAX_PX means lowering retention to stay
   under Safari's ~5MB per-origin cap.
   ────────────────────────────────────────────────────────────────────────── */
const PHOTO_MAX_PX = 480;
const PHOTO_QUALITY = 0.72;
const PHOTO_RETENTION_DAYS = 14;   // after this, image bytes are dropped; meal data is kept forever
const ANALYSIS_MAX_PX = 1600;      // what gets sent to the API — never stored

const ls = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k,v) => { try { localStorage.setItem(k,v); return true; } catch(e) { console.warn("localStorage write failed:",e); return false; } }
};

function makeThumbnail(base64, mimeType, size=PHOTO_MAX_PX, quality=PHOTO_QUALITY) {
  return new Promise(resolve => {
    try {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(size/img.width, size/img.height, 1);
        const w = Math.round(img.width*s), h = Math.round(img.height*s);
        const c = document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = () => resolve(null);
      img.src = `data:${mimeType};base64,${base64}`;
    } catch { resolve(null); }
  });
}

// Shrink a picked File down to ANALYSIS_MAX_PX for the API call.
function fileToImageData(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if (w>ANALYSIS_MAX_PX || h>ANALYSIS_MAX_PX) {
          const s=Math.min(ANALYSIS_MAX_PX/w, ANALYSIS_MAX_PX/h);
          w=Math.round(w*s); h=Math.round(h*s);
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",0.88);
        resolve({ imageData:{base64:dataUrl.split(",")[1], mimeType:"image/jpeg"}, preview:dataUrl });
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

const loadMeals = d => { try { return JSON.parse(ls.get(`jct:m:${d}`) || "[]"); } catch { return []; } };
const saveMeals = (d,m) => ls.set(`jct:m:${d}`, JSON.stringify(m));
const loadBaseGoal = () => parseInt(ls.get("jct:basegoal") || "1600");
const saveBaseGoal = g => ls.set("jct:basegoal", String(g));
const loadKey = () => ls.get("jct:apikey") || "";
const saveKey = k => ls.set("jct:apikey", k);
const loadWeights = () => { try { return JSON.parse(ls.get("jct:weights") || "[]"); } catch { return []; } };
const saveWeights = w => ls.set("jct:weights", JSON.stringify(w));
const loadWorkoutLabels = () => { try { return JSON.parse(ls.get("jct:wlabels") || "[]"); } catch { return []; } };
const saveWorkoutLabels = arr => ls.set("jct:wlabels", JSON.stringify(arr));
const loadFoodHistory = () => { try { return JSON.parse(ls.get("jct:foodhist") || "[]"); } catch { return []; } };
const saveFoodHistory = arr => ls.set("jct:foodhist", JSON.stringify(arr));
const loadLibrary = () => { try { return JSON.parse(ls.get("jct:lib") || "[]"); } catch { return []; } };
const saveLibrary = arr => ls.set("jct:lib", JSON.stringify(arr));

const fmtKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtDisplay = d => d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const isToday = d => fmtKey(d) === fmtKey(new Date());

/* Drop image bytes from meals older than PHOTO_RETENTION_DAYS.
   Calories, protein, titles, and ingredients are kept forever — only photos age out. */
function prunePhotos() {
  try {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - PHOTO_RETENTION_DAYS);
    const cutKey = fmtKey(cutoff);
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith("jct:m:")) continue;
      if (key.slice(6) >= cutKey) continue;
      const meals = JSON.parse(localStorage.getItem(key) || "[]");
      if (!meals.some(m => m.imageBase64)) continue;
      localStorage.setItem(key, JSON.stringify(meals.map(m => ({...m, imageBase64: null}))));
    }
  } catch(e) { console.warn("photo prune failed:", e); }
}

/* Save a day's meals, degrading the newest photo if storage is full rather
   than losing the entry outright. */
async function saveMealsWithFallback(dateKey, meals, rawImage) {
  if (saveMeals(dateKey, meals)) return true;
  if (rawImage?.base64) {
    const small = await makeThumbnail(rawImage.base64, rawImage.mimeType||"image/jpeg", 200, 0.6);
    const retry = meals.map((m,i) => i===meals.length-1 ? {...m, imageBase64:small} : m);
    if (saveMeals(dateKey, retry)) return true;
  }
  const stripped = meals.map((m,i) => i===meals.length-1 ? {...m, imageBase64:null} : m);
  return saveMeals(dateKey, stripped);
}

async function analyze(apiKey, imageData, description) {
  if (!apiKey) throw new Error("No API key — tap ⚙️ Settings to add your OpenAI key");

  const sysPrompt = `You are an expert nutritionist and food label reader with access to USDA databases, restaurant nutrition facts, and packaged food data.

BARCODE & PACKAGING:
- If you see a barcode, UPC, or food package: read ALL visible text including brand name, product name, flavor, size, and any nutrition panel. Use the EXACT published nutrition facts for that specific product.
- Examples: Fairlife 2% milk 11.5oz = 170cal/13g protein. Premier Protein shake = 160cal/30g protein. Kind bar peanut butter = 200cal/7g protein.

RESTAURANT & BRAND FOOD:
- Use real published nutrition data. Examples: Big Mac = 550cal/25g protein. Chipotle chicken burrito bowl (standard) ~800cal/50g protein. Starbucks grande latte whole milk = 220cal/12g protein.

HOMEMADE / PLATED FOOD:
- Estimate the ACTUAL portion size visible in the photo. Look for visual cues: plate size, utensils, food density.
- Never default to a "standard serving" — judge what's actually in the image.

QUANTITIES:
- If user says "two", "3x", "a dozen" etc, multiply all values by that number.

ACCURACY RULES:
- Never return 0 calories for any real food item.
- totalCalories MUST equal the sum of all ingredient calories.
- Estimate totalProteinG and proteinG for every ingredient.
- For emoji: pick ONE emoji that best represents the main food item.
- Return ONLY raw JSON. No markdown fences, no explanation text, nothing else.`;

  const userPrompt = imageData
    ? `Analyze this image carefully.${description ? ` User added: "${description}".` : ""} If you see a barcode or package, identify the exact product and use its real nutrition facts. Return this exact JSON: {"mealTitle":"...","totalCalories":0,"totalProteinG":0,"emoji":"🍔","ingredients":[{"name":"...","calories":0,"proteinG":0}],"summary":"..."}`
    : `The user described their meal: "${description}". Use real brand/USDA data and multiply by any stated quantity. Return this exact JSON: {"mealTitle":"...","totalCalories":0,"totalProteinG":0,"emoji":"🍔","ingredients":[{"name":"...","calories":0,"proteinG":0}],"summary":"..."}`;

  const contentArr = [];
  if (imageData) {
    contentArr.push({
      type: "image_url",
      image_url: { url: `data:${imageData.mimeType};base64,${imageData.base64}`, detail: "high" }
    });
  }
  contentArr.push({ type: "text", text: userPrompt });

  const res = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey}` },
    body: JSON.stringify({
      model: "gpt-5.5",
      messages: [
        { role: "system", content: sysPrompt },
        { role: "user", content: contentArr }
      ],
      max_completion_tokens: 800
    })
  });

  if (!res.ok) {
    let msg = `API error ${res.status}`;
    try { const e = await res.json(); msg = e.error?.message || msg; } catch {}
    if (res.status === 401) throw new Error("Invalid API key — tap ⚙️ to update it");
    if (res.status === 400) throw new Error(`Bad request: ${msg}`);
    if (res.status === 429) throw new Error("Rate limit — wait a moment and try again");
    throw new Error(msg);
  }

  const data = await res.json();
  const rawText = data.choices?.[0]?.message?.content || "";
  const cleaned = rawText.trim().replace(/```json\s*/gi,"").replace(/```/g,"").trim();
  try { return JSON.parse(cleaned); }
  catch {
    const match = cleaned.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
    throw new Error("Unexpected response — please try again");
  }
}

function recordFoodItems(ingredients) {
  if (!ingredients?.length) return;
  const existing = loadFoodHistory();
  const map = {};
  existing.forEach(f => { map[f.name.toLowerCase()] = f; });
  ingredients.forEach(f => { map[f.name.toLowerCase()] = {name:f.name,calories:f.calories,proteinG:f.proteinG||0}; });
  saveFoodHistory(Object.values(map).slice(0,100));
}

/* Every completed meal becomes a reusable template in the library.
   Photos are deliberately not copied in — templates stay tiny. */
function recordMealTemplate(meal) {
  if (!meal || meal.type === "workout") return;
  const title = (meal.mealTitle||"").trim();
  if (!title || title.toLowerCase() === "new meal" || !(meal.totalCalories > 0)) return;
  const lib = loadLibrary();
  const key = title.toLowerCase();
  const prior = lib.find(t => t.key === key);
  const entry = {
    key, mealTitle: title, emoji: meal.emoji || "🍽️",
    totalCalories: meal.totalCalories,
    totalProteinG: meal.totalProteinG || 0,
    summary: meal.summary || "",
    ingredients: (meal.ingredients||[]).map(i => ({
      name: i.name, calories: i.calories, proteinG: i.proteinG || 0,
      baseCalories: i.baseCalories ?? i.calories,
      baseProteinG: i.baseProteinG ?? (i.proteinG || 0),
      servings: i.servings ?? 1
    })),
    lastUsed: Date.now(),
    uses: (prior?.uses || 0) + 1
  };
  saveLibrary([entry, ...lib.filter(t => t.key !== key)].slice(0, 80));
}

function WeightSparkline({data}) {
  if (data.length<2) return null;
  const W=120,H=36,P=4,vals=data.map(d=>d.value);
  const mn=Math.min(...vals),mx=Math.max(...vals),lo=mn-0.5,hi=mx+0.5,range=hi-lo||1;
  const tx=i=>P+(i/(data.length-1))*(W-P*2),ty=v=>P+(1-(v-lo)/range)*(H-P*2);
  const pts=data.map((d,i)=>`${tx(i)},${ty(d.value)}`).join(" ");
  const area=`M${tx(0)},${ty(data[0].value)} `+data.slice(1).map((d,i)=>`L${tx(i+1)},${ty(d.value)}`).join(" ")+` L${tx(data.length-1)},${H} L${tx(0)},${H} Z`;
  const last=data[data.length-1].value,prev=data[data.length-2].value,color=last<=prev?C.accent:C.red;
  return <svg width={W} height={H} style={{overflow:"visible"}}>
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity="0.3"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
    <path d={area} fill="url(#sg)"/>
    <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>

function MealCard({meal,onTap,onDelete}) {
  const [swipeX,setSwipeX]=useState(0);
  const [swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);
  const isWorkout=meal.type==="workout";
  const THRESHOLD=80;
  const srvSummary = !isWorkout && meal.ingredients?.length
    ? meal.ingredients.map(i=>`${i.name}${i.servings && i.servings!==1 ? ` ×${i.servings}` : ""}`).slice(0,3).join(" · ") + (meal.ingredients.length>3?" …":"")
    : null;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+30)));}};
  const onTE=()=>{if(swipeX<=-THRESHOLD){onDelete(meal.id);}else{setSwipeX(0);setSwiping(false);}};
  return <div style={{position:"relative",marginBottom:10,borderRadius:16,overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:C.red,borderRadius:16,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:20}}>
      <span style={{color:"#fff",fontSize:13,fontWeight:400,marginRight:6}}>Delete</span><IcTrash/>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:12,background:C.card,border:`1px solid ${isWorkout?C.oMid:C.border}`,borderRadius:16,padding:"12px 14px",cursor:"pointer",transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onClick={()=>{if(swipeX===0)onTap(meal);}}
      onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      {meal.imageBase64
        ?<img src={`data:${meal.imageMime||"image/jpeg"};base64,${meal.imageBase64}`} style={{width:48,height:48,borderRadius:10,objectFit:"cover",flexShrink:0}} alt=""/>
        :<div style={{width:48,height:48,borderRadius:10,background:isWorkout?C.oDim:C.hover,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:20}}>{isWorkout?"🔥":meal.emoji||"🍽️"}</span></div>
      }
      <div style={{flex:1,minWidth:0}}>
        <p style={{fontSize:13,fontWeight:400,color:isWorkout?C.orange:C.text,marginBottom:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{meal.mealTitle}</p>
        <p style={{fontSize:11,fontWeight:300,color:C.sub,lineHeight:1.4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:1}}>{srvSummary || meal.summary}</p>
        <p style={{fontSize:10,fontWeight:300,color:C.dim,marginTop:2}}>{meal.time}</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0,paddingLeft:8}}>
        <div style={{display:"flex",alignItems:"baseline",gap:3,padding:"6px 10px",background:isWorkout?C.oDim:C.aDim,borderRadius:10}}>
          <span style={{fontSize:18,fontWeight:200,color:isWorkout?C.orange:C.accent,letterSpacing:"-0.5px"}}>{isWorkout?"-":""}{meal.totalCalories}</span>
          <span style={{fontSize:9,fontWeight:300,color:isWorkout?C.oMid:C.aMid,textTransform:"uppercase"}}>cal</span>
        </div>
        {!isWorkout&&(meal.totalProteinG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:"rgba(96,200,245,0.7)"}}>{Math.round(meal.totalProteinG||0)}g pro</span>}
      </div>
    </div>
  </div>;
}

function WorkoutModal({onAdd,onClose}) {
  const [cal,setCal]=useState("");
  const [label,setLabel]=useState(()=>ls.get("jct:lastlabel")||"");
  const [suggestions,setSuggestions]=useState([]);
  const [showSugg,setShowSugg]=useState(false);
  const [allLabels]=useState(()=>loadWorkoutLabels());
  const calRef=useRef();
  useEffect(()=>{setTimeout(()=>calRef.current?.focus(),100);},[]);
  const handleLabelChange=v=>{setLabel(v);if(v.trim()){const m=allLabels.filter(l=>l.toLowerCase().includes(v.toLowerCase())&&l.toLowerCase()!==v.toLowerCase());setSuggestions(m);setShowSugg(m.length>0);}else setShowSugg(false);};
  const submit=()=>{
    const n=parseInt(cal);if(isNaN(n)||n<=0)return;
    const fl=label.trim()||"Workout";ls.set("jct:lastlabel",fl);
    if(fl!=="Workout"){const u=[...new Set([fl,...allLabels])].slice(0,20);saveWorkoutLabels(u);}
    const now=new Date();
    onAdd({id:uid(),type:"workout",mealTitle:fl,totalCalories:n,ingredients:[],summary:`${n} calories burned`,imageBase64:null,time:now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}),addedAt:now.getTime(),emoji:"🔥"});
  };
  return <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"flex-end",zIndex:100}} onClick={onClose}>

      <div style={{position:"relative",marginBottom:12}}>

        {showSugg&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:"hidden",zIndex:10,marginTop:4}}>
          {suggestions.map((s,i)=><div key={i} onMouseDown={()=>{setLabel(s);setShowSugg(false);}} style={{padding:"12px 16px",fontSize:14,color:C.text,cursor:"pointer",borderBottom:i<suggestions.length-1?`1px solid ${C.border}`:"none"}}>{s}</div>)}
        </div>}
      </div>
      <input ref={calRef} type="number" inputMode="numeric" placeholder="Calories burned" value={cal} onChange={e=>setCal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
        style={{width:"100%",background:C.hover,border:`1px solid ${C.border}`,borderRadius:12,color:C.text,fontSize:22,fontWeight:200,padding:"14px 16px",outline:"none",fontFamily:"'Inter',sans-serif",marginBottom:16,letterSpacing:"-0.5px"}}/>
      <button style={{width:"100%",background:C.orange,border:"none",borderRadius:14,color:"#fff",fontSize:15,fontWeight:500,padding:"16px",opacity:parseInt(cal)>0?1:0.4}} onClick={submit} disabled={!(parseInt(cal)>0)}>Add workout 🔥</button>
    </div>
  </div>;
}

// Each ingredient stores: name, calories (current total), proteinG (current total),
// baseCalories (per-serving), baseProteinG (per-serving), servings (float)
function SwipeIngRow({ing,idx,editIdx,editField,servVal,calVal,setServVal,setCalVal,setEditIdx,commitServ,commitCal,onDelete}) {
  const [swipeX,setSwipeX]=useState(0);const[swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);const THRESHOLD=70;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);setSwipeX(0);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<-8){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+20)));}};
  const onTE=e=>{
    const dx=Math.abs(e.changedTouches[0].clientX-tx.current);
    if(dx<8){setSwipeX(0);setSwiping(false);return;}
    if(swipeX<=-THRESHOLD)onDelete(idx);else{setSwipeX(0);setSwiping(false);}
  };
  const servings = ing.servings ?? 1;
  const editingServ = editIdx===idx && editField==="serv";
  const editingCal  = editIdx===idx && editField==="cal";
  return <div style={{position:"relative",overflow:"hidden",borderTop:`1px solid ${C.border}`}}>
    <div style={{position:"absolute",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:16}}>
      <span style={{color:"#fff",fontSize:12,fontWeight:400,marginRight:4}}>Delete</span><IcTrash/>
    </div>
    <div style={{padding:"10px 16px",background:C.surface,transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      <p style={{fontSize:11,fontWeight:300,color:C.sub,marginBottom:6,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{ing.name}</p>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"baseline",gap:4,cursor:"pointer"}}
          onClick={e=>{e.stopPropagation();if(!editingServ){setEditIdx(idx,"serv");setServVal(String(servings));}}}>
          <span style={{fontSize:10,fontWeight:300,color:C.dim,marginRight:2}}>SRV</span>
          {editingServ
            ?<input autoFocus type="number" inputMode="decimal"
                style={{width:60,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:22,fontWeight:200,textAlign:"left",outline:"none",fontFamily:"'Inter',sans-serif",letterSpacing:"-0.5px",padding:0}}
                value={servVal} onChange={e=>setServVal(e.target.value)}
                onBlur={()=>commitServ(idx)} onKeyDown={e=>e.key==="Enter"&&commitServ(idx)}/>
            :<span style={{fontSize:22,fontWeight:200,color:C.text,letterSpacing:"-0.5px"}}>{servings}</span>
          }
          {!editingServ&&<span style={{color:C.dim,display:"inline-flex",alignItems:"center",marginLeft:2}}><IcEdit size={11}/></span>}
        </div>
        <div style={{display:"flex",alignItems:"baseline",gap:4,cursor:"pointer"}}
          onClick={e=>{e.stopPropagation();if(!editingCal){setEditIdx(idx,"cal");setCalVal(String(ing.calories));}}}>
          <span style={{fontSize:10,fontWeight:300,color:C.dim,marginRight:2}}>CAL</span>
          {editingCal
            ?<input autoFocus type="number" inputMode="numeric"
                style={{width:70,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:22,fontWeight:200,textAlign:"right",outline:"none",fontFamily:"'Inter',sans-serif",letterSpacing:"-0.5px",padding:0}}
                value={calVal} onChange={e=>setCalVal(e.target.value)}
                onBlur={()=>commitCal(idx)} onKeyDown={e=>e.key==="Enter"&&commitCal(idx)}/>
            :<span style={{fontSize:22,fontWeight:200,color:C.accent,letterSpacing:"-0.5px"}}>{ing.calories}</span>
          }
          {!editingCal&&<span style={{color:C.dim,display:"inline-flex",alignItems:"center",marginLeft:2}}><IcEdit size={11}/></span>}
          {(ing.proteinG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:"rgba(96,200,245,0.6)",marginLeft:6}}>{Math.round(ing.proteinG)}g pro</span>}
        </div>
      </div>
    </div>
  </div>;
}

const parseServings = ing => {
  if (ing.servings != null && ing.servings !== 1) return ing;
  const m = ing.name.match(/^([\d.\/]+)\s*(?:servings?|srv|x)\s+(?:of\s+)?/i);
  if (m) {
    const n = parseFloat(m[1]);
    if (!isNaN(n) && n > 0 && n !== 1) {
      const baseCal = ing.baseCalories ?? Math.round(ing.calories / n);
      const baseProt = ing.baseProteinG ?? Math.round(((ing.proteinG||0) / n)*10)/10;
      return {...ing, servings:n, baseCalories:baseCal, baseProteinG:baseProt};
    }
  }
  return ing;
};
const normalise = ings => (ings||[]).map(ing=>parseServings({
  ...ing,
  baseCalories: ing.baseCalories ?? ing.calories,
  baseProteinG: ing.baseProteinG ?? (ing.proteinG||0),
  servings: ing.servings ?? 1,
}));

function DetailScreen({meal,onBack,onUpdate,onDelete,apiKey}) {
  const [ings,setIngs]=useState(()=>normalise(meal.ingredients));
  const [editTotal,setEditTotal]=useState(false);
  const [totalVal,setTotalVal]=useState(String(meal.totalCalories));
  const [editTitle,setEditTitle]=useState(false);
  const [titleVal,setTitleVal]=useState(meal.mealTitle);
  const [editIdx,setEditIdx]=useState(null);
  const [editField,setEditField]=useState(null);
  const [servVal,setServVal]=useState("");
  const [calVal,setCalVal]=useState("");
  const [adding,setAdding]=useState(false);
  const [addText,setAddText]=useState("");
  const [addError,setAddError]=useState("");
  const [addLoading,setAddLoading]=useState(false);
  const [busyMsg,setBusyMsg]=useState("");
  const isWorkout=meal.type==="workout";
  const photoRef=useRef();
  const addRef=useRef();

  const setEditIdx2 = (idx, field) => { setEditIdx(idx); setEditField(field); };
  const sumCal = ings.reduce((s,x)=>s+(x.calories||0),0);
  const inSync = ings.length>0 && Math.round(sumCal)===meal.totalCalories;

  const save = (newIngs, extra={}) => {
    const newTot = Math.round(newIngs.reduce((s,x)=>s+(x.calories||0),0));
    const newProt = newIngs.reduce((s,x)=>s+(x.proteinG||0),0);
    setTotalVal(String(newTot));
    onUpdate({...meal, ...extra, totalCalories:newTot, totalProteinG:newProt, ingredients:newIngs});
  };

  const commitTitle = () => {
    const t = titleVal.trim();
    if (t) onUpdate({...meal, mealTitle:t, ingredients:ings});
    else setTitleVal(meal.mealTitle);
    setEditTitle(false);
  };

  const commitTotal=()=>{const n=parseInt(totalVal);if(!isNaN(n)&&n>=0)onUpdate({...meal,totalCalories:n,ingredients:ings});else setTotalVal(String(meal.totalCalories));setEditTotal(false);};

  const commitServ = idx => {
    const n = parseFloat(servVal);
    if (!isNaN(n) && n > 0) {
      const next = ings.map((x,i) => {
        if (i !== idx) return x;
        return {...x, servings:n, calories:Math.round(x.baseCalories*n), proteinG:Math.round((x.baseProteinG||0)*n*10)/10};
      });
      setIngs(next); save(next);
    }
    setEditIdx(null); setEditField(null);
  };

  const commitCal = idx => {
    const n = parseInt(calVal);
    if (!isNaN(n) && n >= 0) {
      const next = ings.map((x,i) => {
        if (i !== idx) return x;
        const newBase = x.servings > 0 ? Math.round(n / x.servings) : n;
        return {...x, calories:n, baseCalories:newBase};
      });
      setIngs(next); save(next);
    }
    setEditIdx(null); setEditField(null);
  };

  const appendIngredients = (raw, extra={}) => {
    const next = [...ings, ...normalise(raw)];
    setIngs(next);
    save(next, extra);
  };

  // Add an item by typing (or keyboard dictation)
  const addByText = async () => {
    if (!addText.trim()) return;
    setAddLoading(true); setAddError("");
    try {
      const r = await analyze(apiKey, null, addText);
      const raw = r.ingredients?.length ? r.ingredients : [{name:r.mealTitle,calories:r.totalCalories,proteinG:r.totalProteinG||0}];
      const extra = {};
      if (!meal.emoji || meal.mealTitle === "New meal") extra.emoji = r.emoji || meal.emoji;
      appendIngredients(raw, extra);
      setAddText(""); setAdding(false);
    } catch(e) { setAddError(e.message||"Couldn't add that — try again"); }
    setAddLoading(false);
  };

  // Add an item by photographing it
  const addByPhoto = async file => {
    setBusyMsg("Analyzing photo…");
    try {
      const shot = await fileToImageData(file);
      if (!shot) { setBusyMsg(""); setAddError("Couldn't read that photo"); return; }
      const r = await analyze(apiKey, shot.imageData, null);
      const raw = r.ingredients?.length ? r.ingredients : [{name:r.mealTitle,calories:r.totalCalories,proteinG:r.totalProteinG||0}];
      const extra = {};
      // First photo added to the meal becomes its cover image.
      if (!meal.imageBase64) {
        const thumb = await makeThumbnail(shot.imageData.base64, "image/jpeg");
        if (thumb) { extra.imageBase64 = thumb; extra.imageMime = "image/jpeg"; }
      }
      if (!meal.emoji || meal.mealTitle === "New meal") extra.emoji = r.emoji || meal.emoji;
      appendIngredients(raw, extra);
    } catch(e) { setAddError(e.message||"Couldn't analyze that photo"); }
    setBusyMsg("");
  };

  if (busyMsg) return <Spinner text={busyMsg}/>;

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader
      left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>}
      title={isWorkout?"Workout":"Meal details"}
      right={<HeaderBtn tone="danger" onClick={()=>onDelete(meal.id)}><IcTrash/></HeaderBtn>}
    />
    {!isWorkout&&(meal.imageBase64
      ?<img src={`data:${meal.imageMime||"image/jpeg"};base64,${meal.imageBase64}`} style={{width:"100%",height:250,objectFit:"cover",display:"block"}} alt=""/>
      :<div style={{width:"100%",height:180,background:C.surface,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:56}}>{meal.emoji||"🍽️"}</span></div>)}
    {isWorkout&&<div style={{width:"100%",height:140,background:C.oDim,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:64}}>🔥</span></div>}

    <div style={{padding:"20px 20px 40px"}}>
      {editTitle
        ?<input autoFocus value={titleVal} onChange={e=>setTitleVal(e.target.value)} onBlur={commitTitle} onKeyDown={e=>e.key==="Enter"&&commitTitle()}
           style={{width:"100%",background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.text,fontSize:22,fontWeight:400,fontFamily:"'Inter',sans-serif",letterSpacing:"-0.3px",outline:"none",padding:"0 0 4px",marginBottom:6}}/>
        :<h2 style={{fontSize:22,fontWeight:400,color:isWorkout?C.orange:C.text,marginBottom:6,letterSpacing:"-0.3px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
           onClick={()=>{setTitleVal(meal.mealTitle);setEditTitle(true);}}>
           {meal.mealTitle}<span style={{color:C.dim,display:"inline-flex"}}><IcEdit size={14}/></span>
         </h2>
      }
      {meal.summary&&<p style={{fontSize:13,fontWeight:300,color:C.sub,lineHeight:1.6,marginBottom:5}}>{meal.summary}</p>}
      <p style={{fontSize:11,color:C.dim,marginBottom:20}}>{meal.time}</p>

      <div style={{display:"flex",gap:10,marginBottom:18}}>
        <div style={{flex:1,display:"flex",flexDirection:"column",gap:4,padding:"14px 18px",background:isWorkout?C.oDim:C.aDim,border:`1px solid ${isWorkout?C.oMid:C.aMid}`,borderRadius:16,cursor:"pointer"}} onClick={()=>{setTotalVal(String(meal.totalCalories));setEditTotal(true);}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontSize:13,fontWeight:400,color:C.text}}>{isWorkout?"Calories burned":"Calories"}</span>
            {editTotal
              ?<input autoFocus type="number" inputMode="numeric" style={{width:80,background:"transparent",border:"none",borderBottom:`2px solid ${isWorkout?C.orange:C.accent}`,color:isWorkout?C.orange:C.accent,fontSize:26,fontWeight:200,fontFamily:"'Inter',sans-serif",outline:"none",textAlign:"right"}} value={totalVal} onChange={e=>setTotalVal(e.target.value)} onBlur={commitTotal} onKeyDown={e=>e.key==="Enter"&&commitTotal()} onClick={e=>e.stopPropagation()}/>
              :<div style={{display:"flex",alignItems:"center",gap:5,color:isWorkout?C.orange:C.accent}}><span style={{fontSize:26,fontWeight:200,letterSpacing:"-1.5px"}}>{meal.totalCalories}</span><span style={{fontSize:11,opacity:0.7}}>kcal</span><IcEdit size={13}/></div>
            }
          </div>
          {!isWorkout&&ings.length>0&&<span style={{fontSize:10,fontWeight:300,color:inSync?C.dim:C.orange}}>
            {inSync ? `total of ${ings.length} ${ings.length===1?"item":"items"}` : `manual override · items total ${Math.round(sumCal)}`}
          </span>}
        </div>
        {!isWorkout&&(meal.totalProteinG||0)>0&&<div style={{padding:"16px 14px",background:"rgba(96,200,245,0.1)",border:"1px solid rgba(96,200,245,0.3)",borderRadius:16,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minWidth:72}}>
          <span style={{fontSize:20,fontWeight:200,color:C.blue,letterSpacing:"-0.5px"}}>{Math.round(meal.totalProteinG||0)}g</span>
          <span style={{fontSize:9,color:C.dim,textTransform:"uppercase",letterSpacing:"0.5px",marginTop:1}}>protein</span>
        </div>}
      </div>

      {!isWorkout&&<div style={{background:C.surface,borderRadius:16,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:12}}>
        <div style={{padding:"12px 16px 10px"}}>
          <p style={{fontSize:11,fontWeight:400,color:C.sub,textTransform:"uppercase",letterSpacing:"1.2px"}}>Items</p>

        {!adding&&<div style={{display:"flex",gap:8,padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
          <button style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:C.hover,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontSize:12,fontWeight:400,padding:"11px"}} onClick={()=>photoRef.current.click()}>

            <IcPencil size={15}/> Describe
          </button>
        </div>}

        <input ref={photoRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{
          const f=e.target.files[0]; e.target.value=""; if(f) addByPhoto(f);
        }}/>

        {adding&&<div style={{padding:"12px 14px",borderTop:`1px solid ${C.border}`}}>
          <textarea ref={addRef} style={{width:"100%",height:64,background:C.hover,border:`1px solid ${addText?C.aMid:C.border}`,borderRadius:10,color:addText?C.text:C.sub,fontSize:13,padding:"9px 12px",resize:"none",outline:"none",fontFamily:"'Inter',sans-serif",lineHeight:1.5,marginBottom:8}}
            placeholder="e.g. half tablespoon of butter — or tap 🎤 on your keyboard"
            value={addText} onChange={e=>setAddText(e.target.value)}/>
          {addError&&<p style={{color:C.red,fontSize:12,marginBottom:6}}>{addError}</p>}
          <div style={{display:"flex",gap:8}}>
            <button style={{flex:1,background:"transparent",border:`1px solid ${C.border}`,borderRadius:10,color:C.sub,fontSize:13,fontWeight:500,padding:"10px"}} onClick={()=>{setAdding(false);setAddText("");setAddError("");}}>Cancel</button>
            <button style={{flex:2,background:addLoading?"transparent":C.accent,border:addLoading?`1px solid ${C.aMid}`:"none",borderRadius:10,color:addLoading?C.accent:C.bg,fontSize:13,fontWeight:500,padding:"10px",opacity:addText.trim()?1:0.35}} onClick={addByText} disabled={!addText.trim()||addLoading}>
              {addLoading?"Calculating…":"Add item →"}
            </button>
          </div>
        </div>}

        {addError&&!adding&&<div style={{padding:"10px 16px",borderTop:`1px solid ${C.border}`}}>
          <p style={{color:C.red,fontSize:12}}>{addError}</p>
        </div>}
      </div>}
    </div>
  </div>;
}

function LibraryScreen({onBack,onPick}) {
  const [lib,setLib]=useState(()=>loadLibrary());
  const [q,setQ]=useState("");
  const filtered = q.trim()
    ? lib.filter(t=>t.mealTitle.toLowerCase().includes(q.trim().toLowerCase()) ||
                    t.ingredients.some(i=>i.name.toLowerCase().includes(q.trim().toLowerCase())))
    : lib;
  const remove = key => { const next=lib.filter(t=>t.key!==key); setLib(next); saveLibrary(next); };

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>} title="Recent meals"/>
    <div style={{padding:"14px 16px 10px",position:"sticky",top:"calc(env(safe-area-inset-top,44px) + 68px)",background:C.bg,zIndex:20}}>
      <div style={{display:"flex",alignItems:"center",gap:9,background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:"10px 13px"}}>
        <span style={{color:C.dim,display:"flex"}}><IcSearch/></span>
        <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search meals and ingredients"
          style={{flex:1,background:"transparent",border:"none",color:C.text,fontSize:14,outline:"none",fontFamily:"'Inter',sans-serif"}}/>
        {q&&<button style={{background:"none",border:"none",color:C.dim,fontSize:13,padding:0}} onClick={()=>setQ("")}>Clear</button>}
      </div>
    </div>
    <div style={{padding:"4px 16px 0"}}>
      {lib.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"56px 24px",gap:10}}>
        <span style={{fontSize:36}}>🗂️</span>
        <p style={{color:C.sub,fontSize:14,fontWeight:300,textAlign:"center",lineHeight:1.6}}>Meals you log will show up here, ready to add again in one tap.</p>
      </div>}
      {lib.length>0&&filtered.length===0&&<p style={{color:C.sub,fontSize:13,fontWeight:300,textAlign:"center",padding:"40px 0"}}>Nothing matches "{q}".</p>}
      {filtered.length>0&&<p style={{fontSize:11,fontWeight:300,color:C.dim,marginBottom:12}}>Tap to add to this day — swipe left to remove from the list</p>}
      {filtered.map(t=><LibraryRow key={t.key} tpl={t} onPick={()=>onPick(t)} onDelete={()=>remove(t.key)}/>)}
    </div>
  </div>;
}

function LibraryRow({tpl,onPick,onDelete}) {
  const [swipeX,setSwipeX]=useState(0);const[swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);const THRESHOLD=75;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+25)));}};
  const onTE=()=>{if(swipeX<=-THRESHOLD)onDelete();else{setSwipeX(0);setSwiping(false);}};
  const when = new Date(tpl.lastUsed).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return <div style={{position:"relative",marginBottom:9,borderRadius:15,overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:18}}>
      <span style={{color:"#fff",fontSize:12,fontWeight:400,marginRight:5}}>Remove</span><IcTrash/>
    </div>
    <div style={{display:"flex",alignItems:"center",gap:12,background:C.card,border:`1px solid ${C.border}`,borderRadius:15,padding:"12px 14px",cursor:"pointer",transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onClick={()=>{if(swipeX===0)onPick();}} onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      <div style={{width:44,height:44,borderRadius:11,background:C.hover,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
        <span style={{fontSize:20}}>{tpl.emoji}</span>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <p style={{fontSize:13,fontWeight:400,color:C.text,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{tpl.mealTitle}</p>
        <p style={{fontSize:11,fontWeight:300,color:C.dim}}>
          {tpl.ingredients.length} {tpl.ingredients.length===1?"item":"items"} · last used {when}{tpl.uses>1?` · ${tpl.uses}×`:""}
        </p>
      </div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"baseline",gap:3,padding:"5px 10px",background:C.aDim,borderRadius:10}}>
          <span style={{fontSize:17,fontWeight:200,color:C.accent,letterSpacing:"-0.5px"}}>{tpl.totalCalories}</span>
          <span style={{fontSize:9,fontWeight:300,color:C.aMid,textTransform:"uppercase"}}>cal</span>
        </div>
        {(tpl.totalProteinG||0)>0&&<span style={{fontSize:10,fontWeight:300,color:"rgba(96,200,245,0.7)"}}>{Math.round(tpl.totalProteinG)}g pro</span>}
      </div>
    </div>
  </div>;
}

function WeightHistoryScreen({onBack}) {
  const [log,setLog]=useState(()=>{
    const all=loadWeights();
    const cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
    return all.filter(w=>w.date>=fmtKey(cutoff)).sort((a,b)=>b.date.localeCompare(a.date));
  });
  const [editDate,setEditDate]=useState(null);
  const [editVal,setEditVal]=useState("");

  const saveAll = next => { setLog(next); saveWeights([...loadWeights().filter(w=>!next.find(n=>n.date===w.date)), ...next].sort((a,b)=>a.date.localeCompare(b.date))); };

  const commitEdit = date => {
    const n=parseFloat(editVal);
    if(!isNaN(n)&&n>0) saveAll(log.map(w=>w.date===date?{...w,value:n}:w));
    setEditDate(null);
  };

  const deleteEntry = date => {
    setLog(log.filter(w=>w.date!==date));
    saveWeights(loadWeights().filter(w=>w.date!==date));
  };

  const fmt = dateStr => new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});

  return <div style={{height:"100%",background:C.bg,overflowY:"auto",paddingBottom:48}}>
    <StickyHeader left={<HeaderBtn onClick={onBack}><IcBack/></HeaderBtn>} title="Weight history"/>
    <div style={{padding:"16px 16px 0"}}>
      <p style={{fontSize:12,fontWeight:300,color:C.dim,marginBottom:16}}>Last 30 days — swipe left to delete</p>
      {log.length===0&&<div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"48px 0",gap:10}}>
        <span style={{fontSize:36}}>⚖️</span>
        <p style={{color:C.sub,fontSize:14,fontWeight:300,textAlign:"center"}}>No weight entries yet.</p>
      </div>}
      {log.map(w=><WeightRow key={w.date} entry={w} isEditing={editDate===w.date} editVal={editVal} setEditVal={setEditVal} onTapEdit={()=>{setEditDate(w.date);setEditVal(String(w.value));}} onCommit={()=>commitEdit(w.date)} onDelete={()=>deleteEntry(w.date)} fmt={fmt}/>)}
    </div>
  </div>;
}

function WeightRow({entry,isEditing,editVal,setEditVal,onTapEdit,onCommit,onDelete,fmt}) {
  const [swipeX,setSwipeX]=useState(0);const[swiping,setSwiping]=useState(false);
  const tx=useRef(0),ty=useRef(0);const THRESHOLD=70;
  const onTS=e=>{tx.current=e.touches[0].clientX;ty.current=e.touches[0].clientY;setSwiping(false);};
  const onTM=e=>{const dx=e.touches[0].clientX-tx.current;const dy=Math.abs(e.touches[0].clientY-ty.current);if(dy>20&&Math.abs(dx)<20)return;if(dx<0){setSwiping(true);setSwipeX(Math.max(dx,-(THRESHOLD+20)));}};
  const onTE=()=>{if(swipeX<=-THRESHOLD)onDelete();else{setSwipeX(0);setSwiping(false);}};
  return <div style={{position:"relative",marginBottom:8,borderRadius:14,overflow:"hidden"}}>
    <div style={{position:"absolute",inset:0,background:C.red,display:"flex",alignItems:"center",justifyContent:"flex-end",paddingRight:18}}>
      <span style={{color:"#fff",fontSize:12,fontWeight:400,marginRight:4}}>Delete</span><IcTrash/>
    </div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,transform:`translateX(${swipeX}px)`,transition:swiping?"none":"transform 0.3s ease"}}
      onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}>
      <span style={{fontSize:13,fontWeight:300,color:C.sub}}>{fmt(entry.date)}</span>
      <div style={{display:"flex",alignItems:"baseline",gap:6}}>
        {isEditing
          ?<input autoFocus type="number" inputMode="decimal" style={{width:70,background:"transparent",border:"none",borderBottom:`2px solid ${C.accent}`,color:C.accent,fontSize:18,fontWeight:200,fontFamily:"'Inter',sans-serif",textAlign:"right",outline:"none",letterSpacing:"-0.5px"}} value={editVal} onChange={e=>setEditVal(e.target.value)} onBlur={onCommit} onKeyDown={e=>e.key==="Enter"&&onCommit()}/>
          :<span style={{fontSize:18,fontWeight:200,color:C.text,letterSpacing:"-0.5px",cursor:"pointer"}} onClick={onTapEdit}>{entry.value}</span>
        }
        <span style={{fontSize:11,fontWeight:300,color:C.dim}}>lbs</span>
        {!isEditing&&<span style={{color:C.dim,cursor:"pointer",display:"inline-flex",alignItems:"center"}} onClick={onTapEdit}><IcEdit/></span>}
      </div>
    </div>
  </div>;
}

function App() {
  const [apiKey,setApiKey]=useState(()=>loadKey());
  const [screen,setScreen]=useState("home");
  const [baseGoal,setBaseGoal]=useState(()=>loadBaseGoal());
  const [selected,setSelected]=useState(null);
  const [camImg,setCamImg]=useState({imageData:null,preview:null});
  const dateKeyRef=useRef(fmtKey(new Date()));
  const [,forceRender]=useState(0);
  const bump=()=>forceRender(n=>n+1);
  const dateKey=dateKeyRef.current;
  const meals=loadMeals(dateKey);
  const burned=meals.filter(m=>m.type==="workout").reduce((s,m)=>s+m.totalCalories,0);
  const effectiveGoal=baseGoal+burned;

  const changeDate=d=>{const k=fmtKey(d);if(k===dateKeyRef.current)return;dateKeyRef.current=k;bump();};

  const nowStamp = () => {
    const now=new Date();
    return { time: now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"}), addedAt: now.getTime() };
  };

  const addMeal = async m => {
    recordFoodItems(m.ingredients);
    const k=dateKeyRef.current;
    const raw = m.imageBase64 ? {base64:m.imageBase64, mimeType:m.imageMime||"image/jpeg"} : null;
    let storable=m;
    if (raw) {
      const thumb = await makeThumbnail(raw.base64, raw.mimeType);
      storable = {...m, imageBase64: thumb || null};
    }
    await saveMealsWithFallback(k, [...loadMeals(k), storable], raw);
    recordMealTemplate(storable);
    setScreen("home");
    bump();
  };

  const addWorkout=w=>{const k=dateKeyRef.current;saveMeals(k,[...loadMeals(k),w]);bump();};

  const updateMeal=m=>{
    recordFoodItems(m.ingredients);
    const k=dateKeyRef.current;
    saveMeals(k,loadMeals(k).map(x=>x.id===m.id?m:x));
    setSelected(m);
    bump();
  };

  const deleteMeal=id=>{const k=dateKeyRef.current;saveMeals(k,loadMeals(k).filter(x=>x.id!==id));setScreen("home");bump();};

  // Start an empty meal and open it so items can be added one at a time.
  const startBuild = () => {
    const k=dateKeyRef.current;
    const m={id:uid(),mealTitle:"New meal",totalCalories:0,totalProteinG:0,ingredients:[],summary:"",imageBase64:null,emoji:"🍽️",...nowStamp()};
    saveMeals(k,[...loadMeals(k),m]);
    setSelected(m); setScreen("detail"); bump();
  };

  // Copy a saved meal into the day being viewed, then open it for edits.
  const addFromLibrary = tpl => {
    const k=dateKeyRef.current;
    const m={
      id:uid(), mealTitle:tpl.mealTitle, emoji:tpl.emoji, summary:tpl.summary,
      totalCalories:tpl.totalCalories, totalProteinG:tpl.totalProteinG,
      ingredients:tpl.ingredients.map(i=>({...i})), imageBase64:null, ...nowStamp()
    };
    saveMeals(k,[...loadMeals(k),m]);
    recordMealTemplate(m);
    setSelected(m); setScreen("detail"); bump();
  };

  // Leaving a meal: save it as a template, and clean up drafts left empty.
  const leaveDetail = () => {
    const k=dateKeyRef.current;
    const cur=loadMeals(k).find(x=>x.id===selected?.id);
    if (cur && cur.type!=="workout" && !(cur.ingredients||[]).length && !cur.totalCalories) {
      saveMeals(k, loadMeals(k).filter(x=>x.id!==cur.id));
    } else if (cur) {
      recordMealTemplate(cur);
    }
    setScreen("home"); bump();
  };

  const clearApiKey=()=>{saveKey("");setApiKey("");};
  const saveApiKey=k=>{saveKey(k);setApiKey(k);};
  const selectMeal=m=>{
    if(m._delete){const k=dateKeyRef.current;saveMeals(k,loadMeals(k).filter(x=>x.id!==m.id));bump();return;}
    setSelected(m);setScreen("detail");
  };

  if (!apiKey) return <ApiKeyScreen onSave={saveApiKey}/>;

  return <div style={{height:"100%"}}>
    {screen==="home"&&<HomeScreen
      onOpenCamera={(imageData,preview)=>{setCamImg({imageData,preview});setScreen("camera");}}
      onOpenDescribe={()=>setScreen("describe")}
      onOpenLibrary={()=>setScreen("library")}
      onStartBuild={startBuild}
      onAddWorkout={addWorkout} onSelectMeal={selectMeal}
      onOpenSettings={()=>setScreen("settings")}
      onOpenWeightHistory={()=>setScreen("weightHistory")}
      meals={meals} goal={effectiveGoal} baseGoal={baseGoal}
      setBaseGoal={n=>{setBaseGoal(n);saveBaseGoal(n);}}
      date={new Date(dateKey+"T12:00:00")} setDate={changeDate}
    />}
    {screen==="camera"&&<PhotoScreen apiKey={apiKey} imageData={camImg.imageData} imagePreview={camImg.preview} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="describe"&&<DescribeScreen apiKey={apiKey} onBack={()=>setScreen("home")} onAdd={addMeal}/>}
    {screen==="library"&&<LibraryScreen onBack={()=>setScreen("home")} onPick={addFromLibrary}/>}
    {screen==="detail"&&selected&&<DetailScreen meal={selected} onBack={leaveDetail} onUpdate={updateMeal} onDelete={deleteMeal} apiKey={apiKey}/>}
    {screen==="settings"&&<SettingsScreen apiKey={apiKey} onSave={saveApiKey} onClear={clearApiKey} onBack={()=>setScreen("home")}/>}
    {screen==="weightHistory"&&<WeightHistoryScreen onBack={()=>setScreen("home")}/>}
  </div>;
}

prunePhotos();

if (window.__bootTimeout) clearTimeout(window.__bootTimeout);
try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
} catch(e) {
  document.getElementById("root").innerHTML =
    '<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0A0A0F;color:#F0F0F8;font-family:sans-serif;padding:24px;text-align:center;gap:8px;">' +
    '<p style="font-size:32px;">⚠️</p>' +
    '<p style="font-size:15px;font-weight:600;">Something went wrong</p>' +
    '<p style="font-size:12px;opacity:0.6;max-width:280px;">' + (e.message||"Unknown error") + '</p>' +
    '<button onclick="location.reload()" style="margin-top:16px;background:#4AE68A;border:none;border-radius:10px;color:#0A0A0F;font-size:14px;font-weight:600;padding:12px 24px;">Reload</button>' +
    '</div>';
}
</script>
</body>
</html>
